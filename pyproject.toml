[project]
name = "rapid-quiz-api"
version = "1.0.0"
description = "Rapid Quiz backend — Django + DRF REST API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "django-ipware>=7.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "pip-tools>=7.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "apps*", "common*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["apps", "common", "config"]
omit = ["**/migrations/**", "config/wsgi.py", "config/asgi.py", "config/settings/production.py"]
